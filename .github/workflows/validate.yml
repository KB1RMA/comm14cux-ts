name: Validate Build, Tests and Style
run-name: Validate Build, Tests and Style

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run type:check
      - run: npm test -- --run --coverage
      - run: npm run build
