name: Release
run-name: Release ${{ github.event.release.tag_name || github.ref_name }}

# Tests and builds a commit, runs the acceptance suite against that build, and
# only if everything passes publishes the package to npm with a provenance
# statement. It runs in two cases:
#   - A GitHub release is published (by merging release-please's release pull
#     request). The tagged commit is published as the stable version, with the
#     `latest` dist-tag.
#   - release-please updates its release pull request branch. That commit is
#     published as a beta, `<version>-beta.<run number>`, with the `next`
#     dist-tag, so the version about to be released can be tried with
#     `npm install @kb1rma/libcomm14cux-ts@next` before the pull request is
#     merged.
#
# Publishing uses npm trusted publishing (OIDC), so there is no npm token. The
# trusted publisher configured on the package at npmjs.com names this
# repository, this workflow file (release.yml) and the `publish-npm`
# environment, so npm only accepts a publish from the publish job below.

permissions:
  contents: read

on:
  release:
    types:
      - published
  push:
    branches:
      - release-please--branches--main*
  # Retries a publish by hand, for example after an npm outage. The ref must
  # be a release's tag or the release pull request branch; the run fails on
  # any other ref.
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Only a release's tag or the release pull request's branch may be
      # published, including on a manual run.
      - name: Work out the version to publish
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/tags/*)
              if [[ "$TAG" != "v${base}" ]]; then
                echo "::error::Tag ${TAG} does not match package.json version ${base}."
                exit 1
              fi
              prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
              version="$base"
              # A prerelease must never take the latest dist-tag.
              if [[ "$prerelease" == "true" || "$base" == *-* ]]; then npm_tag=next; else npm_tag=latest; fi
              ;;
            refs/heads/release-please--branches--main*)
              version="${base}-beta.${GITHUB_RUN_NUMBER}"
              npm_tag=next
              ;;
            *)
              echo "::error::Run this workflow on a release tag or the release pull request branch, not ${GITHUB_REF}."
              exit 1
              ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${npm_tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version} with the ${npm_tag} dist-tag."

      - run: npm ci
      - run: npm run lint
      - run: npm run type:check
      - run: npm test -- --run --coverage
      - run: npm run test:acceptance:dist
      - run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for npm publish rights
    # The trusted publisher on npm requires this environment name. Add
    # required reviewers to the environment to gate each publish behind a
    # manual approval.
    environment:
      name: publish-npm
      url: https://www.npmjs.com/package/@kb1rma/libcomm14cux-ts/v/${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1
      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # A beta's version is not committed anywhere; it is set here, in the
      # working tree only, so the published package.json carries it.
      - name: Set the version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm pkg set version="$VERSION"
      # Betas and prereleases go to the "next" dist-tag so `npm install`
      # never picks them up as the latest version.
      - name: Publish
        env:
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"
