name: Release
run-name: Release ${{ github.event.release.tag_name || github.ref_name }}

# Tests and builds a commit, runs the acceptance suite against that build, and
# only if everything passes publishes the package to npm with a provenance
# statement. It runs in two cases:
#   - A GitHub release is published (by merging release-please's release pull
#     request). The tagged commit is published as the stable version, with the
#     `latest` dist-tag.
#   - release-please updates its release pull request branch. That commit is
#     published as a beta, `<version>-beta.<run number>`, with the `next`
#     dist-tag, so the version about to be released can be tried with
#     `npm install @kb1rma/libcomm14cux-ts@next` before the pull request is
#     merged.
#
# Publishing uses npm trusted publishing (OIDC), so there is no npm token. The
# trusted publisher configured on the package at npmjs.com names this
# repository, this workflow file (release.yml) and the `publish-npm`
# environment, so npm only accepts a publish from the publish job below. npm
# records a signed SLSA provenance statement for every version it publishes,
# betas included.
#
# The package tarball is packed once, in the build job, and that exact file is
# what is published. For a stable release, the attest job then also signs three
# attestations about the tarball, stores them on the repository and attaches
# them to the GitHub release as Sigstore bundles, so they can be verified
# offline. See "Verifying a release" in README.md.
#   - SLSA build provenance (which workflow, commit and runner built it)
#   - a CycloneDX SBOM of the runtime dependencies
#   - an in-toto test result listing the unit and acceptance tests that passed

permissions:
  contents: read

on:
  release:
    types:
      - published
  push:
    branches:
      - release-please--branches--main*
  # Retries a publish by hand, for example after an npm outage. The ref must
  # be a release's tag or the release pull request branch; the run fails on
  # any other ref.
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      name: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Only a release's tag or the release pull request's branch may be
      # published, including on a manual run.
      - name: Work out the version to publish
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/tags/*)
              if [[ "$TAG" != "v${base}" ]]; then
                echo "::error::Tag ${TAG} does not match package.json version ${base}."
                exit 1
              fi
              prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
              version="$base"
              # A prerelease must never take the latest dist-tag.
              if [[ "$prerelease" == "true" || "$base" == *-* ]]; then npm_tag=next; else npm_tag=latest; fi
              ;;
            refs/heads/release-please--branches--main*)
              version="${base}-beta.${GITHUB_RUN_NUMBER}"
              npm_tag=next
              ;;
            *)
              echo "::error::Run this workflow on a release tag or the release pull request branch, not ${GITHUB_REF}."
              exit 1
              ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${npm_tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version} with the ${npm_tag} dist-tag."

      - run: npm ci
      - run: npm run lint
      - run: npm run type:check
      - name: Unit tests
        run: >
          npm test -- --run --coverage
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json=test-reports/unit-results.json
      - name: Acceptance tests (built package)
        run: >
          npm run test:acceptance:dist --
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json=test-reports/acceptance-results.json

      # The tarball is what gets published, so the version a beta publishes
      # under is set here, in the working tree only, before it is packed.
      - name: Pack
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          mkdir -p package
          npm pack --pack-destination package --silent
          tarball=$(ls package/*.tgz)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$tarball" .tgz)" >> "$GITHUB_OUTPUT"

      # GPL v3 requires the complete corresponding source to ship with the
      # package: the TypeScript sources and the source maps.
      - name: Check the tarball carries its source
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          listing=$(tar -tzf "$TARBALL")
          for file in package/LICENSE package/dist/index.js package/dist/index.js.map package/src/index.ts; do
            if ! grep -qx "$file" <<< "$listing"; then
              echo "::error::${file} is missing from the package."
              exit 1
            fi
          done

      # Runtime dependencies only: dev tools are not part of the package.
      - name: Generate SBOM
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: >
          npm sbom --sbom-format cyclonedx --omit dev
          > "package/${NAME}.cdx.json"

      # https://github.com/in-toto/attestation/blob/main/spec/predicates/test-result.md
      # The configuration records the test setup and the lockfile.
      - name: Build test result predicate
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          configuration=$(
            sha256sum vitest.config.ts vitest.acceptance.config.ts package-lock.json |
              jq -R -s 'split("\n") | map(select(length > 0) | split("  ") | {name: .[1], digest: {sha256: .[0]}})'
          )
          jq -s --arg url "$RUN_URL" --arg root "$PWD/" --argjson configuration "$configuration" '
            def tests($status): [
              .[] | .testResults[]
              | (.name | ltrimstr($root)) as $file
              | .assertionResults[]
              | select(.status == $status)
              | "\($file) > \(.fullName)"
            ];
            {
              result: (if all(.[]; .success) then "PASSED" else "FAILED" end),
              configuration: $configuration,
              url: $url,
              passedTests: tests("passed"),
              warnedTests: [],
              failedTests: tests("failed")
            }' test-reports/unit-results.json test-reports/acceptance-results.json > package/test-result.json

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: package
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for npm publish rights
    # The trusted publisher on npm requires this environment name. Add
    # required reviewers to the environment to gate each publish behind a
    # manual approval.
    environment:
      name: publish-npm
      url: https://www.npmjs.com/package/@kb1rma/libcomm14cux-ts/v/${{ needs.build.outputs.version }}
    steps:
      # This job deliberately does not check out the repository, so there is
      # no .nvmrc to read; keep this in step with it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1
      - name: Download the tested package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: package
      # Betas and prereleases go to the "next" dist-tag so `npm install`
      # never picks them up as the latest version.
      - name: Publish
        env:
          NAME: ${{ needs.build.outputs.name }}
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
        # The leading ./ makes npm treat this as a file; "package/x.tgz" alone is
        # read as a GitHub user/repo shorthand.
        run: npm publish "./package/${NAME}.tgz" --provenance --access public --tag "$NPM_TAG"

  attest:
    name: Attest and upload to the release
    needs: [build, publish]
    # Betas have no GitHub release to attach to.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
      id-token: write # sign attestations with Sigstore
      attestations: write # store attestations on the repository
    env:
      NAME: ${{ needs.build.outputs.name }}
    steps:
      - name: Download the published package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: package/${{ env.NAME }}.tgz

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@v4
        with:
          subject-path: package/${{ env.NAME }}.tgz
          sbom-path: package/${{ env.NAME }}.cdx.json

      - name: Attest test results
        id: test-result
        uses: actions/attest@v4
        with:
          subject-path: package/${{ env.NAME }}.tgz
          predicate-type: https://in-toto.io/attestation/test-result/v0.1
          predicate-path: package/test-result.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          TEST_RESULT_BUNDLE: ${{ steps.test-result.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "package/${NAME}.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "package/${NAME}.sbom.sigstore.json"
          cp "$TEST_RESULT_BUNDLE" "package/${NAME}.test-result.sigstore.json"
          mv package/test-result.json "package/${NAME}.test-result.json"
          gh release upload "$TAG" package/* --clobber --repo "$GITHUB_REPOSITORY"
